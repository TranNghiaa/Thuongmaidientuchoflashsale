x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__Default: ${ConnectionStrings__Default}
  RabbitMq__Uri: ${RabbitMq__Uri}
  Jwt__Secret: ${Jwt__Secret}
  Jwt__Issuer: ${Jwt__Issuer}
  Jwt__Audience: ${Jwt__Audience}
  Minio__Endpoint: ${Minio__Endpoint}
  Minio__PublicEndpoint: ${Minio__PublicEndpoint}
  Minio__AccessKey: ${Minio__AccessKey}
  Minio__SecretKey: ${Minio__SecretKey}
  Minio__Bucket: ${Minio__Bucket}
  Admin__Email: ${Admin__Email}
  Admin__Password: ${Admin__Password}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopflow
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3.13-management
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["dotnet", "ShopFlow.Host.dll", "--migrate", "--seed"]
    restart: "no"
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *api-env
      INSTANCE_ID: api1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *api-env
      INSTANCE_ID: api2
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

volumes:
  db_data:
